name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_APP_TITLE: Gestao de Materiais CRM
          VITE_ROUTER_BASENAME: /gestaomateriasCRM
          VITE_STORAGE_MODE: github
          VITE_GITHUB_OWNER: AllysonBastosAlmeida
          VITE_GITHUB_REPO: gestaomateriasCRM
          VITE_GITHUB_BRANCH: storage
          VITE_GITHUB_FILE_PATH: shared/workspace.json
          VITE_GITHUB_TOKEN_PART_A: gho_hvKa6jXBgVu
          VITE_GITHUB_TOKEN_PART_B: 61NhSDaQIeayxx
          VITE_GITHUB_TOKEN_PART_C: HOL1U30SFUp
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
